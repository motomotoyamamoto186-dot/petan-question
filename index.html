<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F.I.P.J.P. 競技規則 5択問題集（審判口頭試問シミュレーション対応版）</title>
<style>
  :root {
    --bg: #f3f6fa;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --accent: #0f4c81;
    --accent-hover: #09355c;
    --ok: #15803d;
    --ok-bg: #dcfce7;
    --ng: #b91c1c;
    --ng-bg: #fee2e2;
    --border: #cbd5e1;
    --tag-bg: #e0f2fe;
    --tag-text: #0369a1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
  }
  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 8px;
    color: var(--accent);
  }
  .muted { color: var(--muted); font-size: 0.92rem; }
  .mode-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary {
    background: #e2e8f0;
    color: var(--text);
  }
  button.secondary:hover:not(:disabled) { background: #cbd5e1; }
  button.mode-active {
    background: var(--accent);
    color: #fff;
  }
  .q-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 0.88rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .tag {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--tag-text);
    font-weight: 700;
    font-size: 0.8rem;
    padding: 2px 8px;
    border-radius: 6px;
  }
  .q-text {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 14px;
    white-space: pre-line;
  }
  .choice {
    display: block;
    width: 100%;
    text-align: left;
    background: #f8fafc;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    margin-bottom: 8px;
    font-size: 0.96rem;
    font-weight: 400;
  }
  .choice:hover { background: #eef6ff; border-color: var(--accent); }
  .choice.selected { background: #dbeafe; border-color: var(--accent); font-weight: 600; }
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .res-item {
    border-top: 1px solid var(--border);
    padding-top: 14px;
    margin-top: 14px;
  }
  .badge-ok {
    display: inline-block;
    background: var(--ok-bg);
    color: var(--ok);
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.85rem;
  }
  .badge-ng {
    display: inline-block;
    background: var(--ng-bg);
    color: var(--ng);
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.85rem;
  }
  .exp {
    background: #f8fafc;
    border-left: 3px solid var(--accent);
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 0.92rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="app-view"></div>
</div>

<script>
const QUESTIONS = [
  // --- 審判シミュレーション・口頭試問形式（22問） ---
  {
    cat: "sim",
    q: "【口頭試問1：サークルとビュット配置】\nAチームがビュット投入に失敗しました。規定によりBチームがビュットを有効な位置に置くことになりましたが、Bチームの選手はエンドラインから30cmしか離れていない位置にビュットを置きました。審判としてどう裁定・対応しますか？",
    choices: [
      "第6条および第7条に基づき、有効位置（エンドラインから50cm以上）に置かなかったBチームの競技者に第35条の罰則を適用する（再度起きた場合はチーム全体に新たなカードが課される）。",
      "第7条に基づき、Bチームにもう一度だけビュットを置き直す権利を与え、罰則は科さない。",
      "Bチームが配置に失敗したため、ビュット投入権をAチームに戻して投げ直させる。",
      "そのまま第1投目を投げさせ、Aチームが異議を唱えなければ有効として続行する。",
      "Bチームをその場で当該試合失格とする。"
    ],
    ans: 0,
    exp: "第6条・第7条により、相手チームは有効な位置（エンドラインや障害物から50cm以上等）にビュットを置かなければなりません。有効な位置に置かなかった場合、その競技者に第35条の罰則が適用され、再度起きた場合は前の反則カードに加えて新たなカードがチーム全体に課されます。"
  },
  {
    cat: "sim",
    q: "【口頭試問2：投球前のサークルの扱い】\nビュットを投げる権利を得たAチームの選手が、これから使うサークルのすぐ隣に前のメーヌの描かれたサークルが残っているのに消さずにビュットを投げようとしています。また、サークル内の小石を取り除きました。審判としてどう判断しますか？",
    choices: [
      "第6条に基づき、周辺のすべての投球サークルはビュット投入前に消させなければならない。一方、サークル内の砂利等の除去はメーヌ間は認められる（ただしメーヌ終了時に元に戻す義務がある）。",
      "周辺の古いサークルは消す必要はないが、サークル内の砂利を取り除くことは第10条違反となる。",
      "古いサークルの消去もサークル内の砂利の除去も、どちらも禁止されているため第35条の罰則を科す。",
      "古いサークルを消さずにビュットを投げた場合、ビュットは即座に相手チームへ渡される。",
      "サークル内の砂利を取り除いた場合、メーヌ終了時に元に戻す必要はない。"
    ],
    ans: 0,
    exp: "第6条により、ビュットを投げるチームはこれから使うサークルの周辺にあるすべての投球サークルを消さなければなりません。また、サークル内の砂利などはメーヌの間は一時的に取り除くことができますが、そのメーヌの終了時に元の通りに戻さなければなりません。"
  },
  {
    cat: "sim",
    q: "【口頭試問3：未投球残存中のサークル回収】\nAチームにはまだ投げるブールが1球残っているのに、Aチームの選手がうっかりポータブルサークルを地面から拾い上げてしまいました。選手から「元の場所に置き直して投げてもいいですか？」と聞かれたとき、審判としてどう答えますか？",
    choices: [
      "第6条に基づき、サークルは元の場所に戻しますが、あなたのチーム（Aチーム）は残りのブールを投げることができず、相手チーム（Bチーム）しか投球できなくなります。",
      "第6条に基づき、マーキングがあれば元の場所に置き直して、Aチームも残りの1球を通常通り投げられます。",
      "サークルを拾い上げた時点でそのメーヌは即座に終了となり、その時点の配置で得点を数えます。",
      "第35条によりレッドカードを提示し、拾い上げた選手を退場させます。",
      "相手チームが同意すれば、Aチームも残りのブールを投げることができます。"
    ],
    ans: 0,
    exp: "第6条により、まだ投球するブールが残っているのにサークルを拾い上げた場合、サークルは元に戻されますが、その場合はもう相手チームしか投球することができなくなります。"
  },
  {
    cat: "sim",
    q: "【口頭試問4：ビュット投入後の異議タイミング】\nAチームが投げたビュットが規定の6mに届いていないように見えました。しかし両チームとも気づかず、Aチームが第1投目を投げ、続いてBチームも第1投目を投げた直後に、Bチームの選手から「審判！このビュットは6m未満だから無効にして置き直させてほしい」と抗議がありました。どう裁定しますか？",
    choices: [
      "第8条に基づき、相手チーム（Bチーム）も既にブールを投げているため、ビュットは最終的に有効と認められ、いかなる抗議も認められません。",
      "第7条に基づき、審判員が巻尺で計測し、6m未満であれば今からでもメーヌをやり直させます。",
      "Aチームが第1投目を投げた時点で既に異議の権利は消滅しているため認められません。",
      "第31条に基づき、試合終了前であればいつでも抗議できるため、計測して置き直させます。",

    ans: 0,

  },
  {
    cat: "sim",
    q: "【口頭試問5：ビュットがブールの後ろに隠れた場合】\nメーヌの途中でビュットが弾かれて移動し、投球サークルから見ると手前にあるブールの陰に完全に隠れて見えなくなりました。攻撃側の選手から「サークルからビュットが見えないので第9条によりビュット無効では？」と質問されました。審判の正しい対応はどれか？",
    choices: [
      "第9条2)に基づき、ビュットがブールの後ろにあって見えない場合は有効です。必要であれば審判員が一時的にブールを取り除いて確認します。",
      "第9条2)に基づき、理由を問わずサークルから直立姿勢で見えなくなれば常にビュット無効となります。",
      "手前のブールを動かせば見える場合でも、そのブールを動かしてはならないため無効とします。",
      "投球する選手がサークルの外へ一歩出てビュットが見える位置から投げれば有効とします。",
      "第14条を適用し、そのメーヌを無効として最初からやり直します。"
    ],
    ans: 0,
    exp: "第9条2)により、正規テランでビュットが移動してサークルから見えなくなったときは無効ですが、「ビュットがブールの後ろにあって見えない場合は有効」です。審判員はビュットが見えるかどうかを確認するため、一時的にブールを取り除くことができます。"
  },
  {
    cat: "sim",
    q: "【口頭試問6：隣接テランへ移動したビュットの扱い】\nラインで区切られたテランでの試合中、ティールで弾かれたビュットがサイドラインを越えて隣のテラン（1つ隣の試合中のレーン）に入りました。ただしエンドラインは越えておらず、距離も20m以内です。選手たちから指示を求められた審判の正しい対応はどれか？",
    choices: [
      "第9条4)および第13条に基づき、向こう隣り（2つ隣以上）ではなく1つ隣のテランであればビュットは有効です。隣のテランで開始されているメーヌが終わるのを忍耐と礼節をもって待ってから、このメーヌを終了させます。",
      "第9条4)に基づき、サイドラインを完全に越えて隣のテランに入った時点で即座にビュット無効となります。",
      "隣のテランの試合を中断させ、こちらが先にメーヌを終了させてから元のテランに戻ります。",
      "ビュットは有効ですが、次のメーヌもそのまま隣のテランで続けます。",
      "第15条を適用し、元のテランの境界線上にビュットを戻して続行します。"
    ],
    ans: 0,
    exp: "第9条4)（原文：traverse plus d'un des jeux contigus / 隣のテランを越えて向こう隣りに入った場合が無効）および第13条により、1つ隣のテランへ移動したビュットは第9条に該当しない限り有効であり、そのテランのメーヌが終わるのを待って終了させます。"
  },
  {
    cat: "sim",
    q: "【口頭試問7：無効ブールの放置と相手チームの投球】\nAチームが投げたブールがエンドラインを完全に越えて無効になりましたが、両チームとも気づかずテランから取り除きませんでした。その後、Bチームが次の1球を投げた直後に、Aチームが「さっきの自分たちのブールは無効だったから取り除いてほしい」と申し出ました。審判の裁定は？",
    choices: [
      "第19条に基づき、無効となったブールを直ちに取り除く措置を怠ったまま相手チーム（Bチーム）がブールを投げたため、そのブールは有効となります。",
      "第19条に基づき、一度ラインを越えたブールはいかなる場合も無効なので、今からでも取り除きます。",
      "Bチームが投げたブールを無効にして投げ直させ、Aチームの無効ブールを取り除きます。",
      "第35条により、取り除きを怠ったAチームにイエローカードを科したうえで取り除きます。",
      "そのメーヌ自体を無効としてやり直します。"
    ],
    ans: 0,
    exp: "第19条により、無効となったブールは直ちに取り除かなければならず、この措置を怠った場合、相手チームがブールを投げた後はそのブールが有効となります。"
  },
  {
    cat: "sim",
    q: "【口頭試問8：ポワンテしたブールが相手選手に当たった場合】\nAチームの選手がポワンテで転がしたブールが、テラン脇に立っていたBチーム（相手チーム）の選手の足に偶然当たって止まってしまいました。審判として誰にどのような選択権を与えますか？",
    choices: [
      "第20条に基づき、投げた競技者（Aチームの選手）に「投げ直す」か「その停止した位置のままにする」かの選択権を与えます。",
      "第20条に基づき、当たった相手チーム（Bチーム）に「停止位置のまま」か「延長線上に置く」かの選択権を与えます。",
      "同じチームの競技者に当たった場合と同様、そのブールは即座に無効となります。",
      "観客や審判員に当たった場合と同様、必ずその停止した位置のまま有効とします。",
      "偶然であっても身体に当たったため、Bチームの選手にイエローカードを提示します。"
    ],
    ans: 0,
    exp: "第20条により、ポワンテしたブールが相手チームにより偶然に止められるか方向を変えられた場合、投げた競技者は「投げ直す」か「その停止した位置のままとする」かを選ぶことができます。"
  },
  {
    cat: "sim",
    q: "【口頭試問9：ティールされたブールが競技者に当たった場合】\nAチームのティールによって弾き飛ばされたブールが、Bチームの競技者の足に偶然当たって止まりました。マーキングは事前にされていました。審判としてどう裁定しますか？",
    choices: [
      "第20条に基づき、止めた競技者の相手チーム（Aチーム）が「1)停止位置のままにする」か「2)元の地点から停止位置を結ぶ延長線上の正規テラン内の任意地点に置く」かを選べます。",
      "第20条に基づき、弾かれたブールは必ず元の位置に戻さなければなりません。",
      "Bチームの競技者に当たったため、Bチームに選択権があります。",
      "マーキングの有無にかかわらず、そのブールは無効となりテランから取り除かれます。",
      "ティールしたAチームの選手にもう一度ティールをやり直させます。"
    ],
    ans: 0,
    exp: "第20条により、ティールしたブールまたはティールされたブールが競技者によって偶然に止められるか方向を変えられた場合、止めた競技者の相手チームが1)停止位置のまま、または2)延長線上の任意地点（正規テラン内・マーキングありの場合）を選べます。"
  },
  {
    cat: "sim",
    q: "【口頭試問10：時間超過と累積イエローカード】\n既にこの試合でイエローカードを受けているAチームの選手Xが、投球制限時間の1分を超過してしまいました。Aチームには他に選手Yと選手Zがおり、2人はまだカードを受けていません。審判として誰にどのような制裁を科しますか？（第35条）",
    choices: [
      "時間超過のイエローカードをAチームの競技者全員（X・Y・Z）に科し、既にカードを持っていたXには現メーヌ（投球済みなら次メーヌ）のブール1球を取り消す。",

    ],
    ans: 0,
    exp: "第35条1)により、時間超過違反のイエローカードは違反チームの競技者全員に科されます。そして既にイエローカードを受けている競技者（X）は、そのメーヌでブール1球が取り消されます（投球が終わっている場合は次のメーヌの1球が取り消されます）。"
  },
  {
    cat: "sim",
    q: "【口頭試問11：アドヴァンテージルール】\nAチームの選手がサークルから片足を完全に踏み出した状態でティールを行い、Bチームの最良球を弾き飛ばしました。Bチームの選手から「今の投球は反則だから無効にして弾かれたうちの球を戻してほしい」と求められました。審判の対応として正しいものはどれか？（第24条）",
    choices: [
      "第24条に基づき、投球に関する規則違反のブールは無効とし、動かされたブールやビュットはマーキングがあればすべて元の位置に戻す（ただし相手チームが有効と宣言するアドヴァンテージルールを選べばそのまま有効となる）。",
      "反則投球であっても、相手チームにアドヴァンテージルールの選択権はなく、必ず審判が無効としなければならない。",
      "サークル違反は第35条の罰則対象であるため、ブールは常に有効としたままイエローカードだけを出す。",

  },
  {
    cat: "sim",
    q: "【口頭試問12：相手チームの配置の立ち位置】\nAチームの選手が投球しようとしているとき、相手であるBチームの選手が投球サークルの真横1mの距離に立って腕を組んで見ています。Aチームから注意してほしいと言われた場合、審判はどう指示しますか？（第17条）",

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let currentMode = "all"; // "all" or "sim"
let session = null;

function startNewSet(mode) {
  currentMode = mode;
  const pool = mode === "sim"
    ? QUESTIONS.filter((item) => item.cat === "sim")
    : QUESTIONS;

  const picked = shuffle(pool).slice(0, 10).map((item) => {
    const pairs = item.choices.map((text, idx) => ({ text, isCorrect: idx === item.ans }));
    const shuffledChoices = shuffle(pairs);
    return {
      cat: item.cat,
      q: item.q,
      choices: shuffledChoices.map((c) => c.text),
      correctIdx: shuffledChoices.findIndex((c) => c.isCorrect),
      exp: item.exp,
      selected: null
    };
  });

  session = {
    poolCount: pool.length,
    questions: picked,
    index: 0,
    submitted: false,
    onlyWrong: false
  };
  renderQuiz();
}

function renderQuiz() {
  const app = document.getElementById("app-view");
  const cur = session.questions[session.index];
  const answeredCount = session.questions.filter((q) => q.selected !== null).length;
  const tagLabel = cur.cat === "sim" ? "審判口頭試問シミュレーション" : "競技規則・罰則知識";

  const choicesHtml = cur.choices.map((c, idx) => {
    const sel = cur.selected === idx ? "selected" : "";
    return `<button type="button" class="choice ${sel}" data-idx="${idx}">${idx + 1}. ${c}</button>`;
  }).join("");

  app.innerHTML = `
    <div class="card">
      <div class="mode-bar">
        <button type="button" class="${currentMode === 'all' ? 'mode-active' : 'secondary'}" id="mode-all">全問題ランダム（全${QUESTIONS.length}問）</button>
        <button type="button" class="${currentMode === 'sim' ? 'mode-active' : 'secondary'}" id="mode-sim">口頭試問・審判シミュレーションのみ（${QUESTIONS.filter(x => x.cat === 'sim').length}問）</button>
      </div>
      <div class="q-meta">
        <span>第 ${session.index + 1} 問 / 全 10 問（回答済み ${answeredCount} / 10）</span>
        <span class="tag">${tagLabel}</span>
      </div>
      <div class="q-text">${cur.q}</div>
      <div>${choicesHtml}</div>
      <div class="nav-row">
        <div>
          <button type="button" class="secondary" id="prev-btn" ${session.index === 0 ? "disabled" : ""}>前の問題</button>
          <button type="button" class="secondary" id="next-btn" ${session.index === 9 ? "disabled" : ""}>次の問題</button>
        </div>
        <button type="button" id="grade-btn">10問まとめて採点・解説</button>
      </div>
    </div>
  `;

  document.getElementById("mode-all").addEventListener("click", () => {
    if (currentMode !== "all") startNewSet("all");
  });
  document.getElementById("mode-sim").addEventListener("click", () => {
    if (currentMode !== "sim") startNewSet("sim");
  });

  app.querySelectorAll(".choice").forEach((btn) => {
    btn.addEventListener("click", () => {
      cur.selected = Number(btn.dataset.idx);
      renderQuiz();
    });
  });

  document.getElementById("prev-btn").addEventListener("click", () => {
    if (session.index > 0) { session.index--; renderQuiz(); }
  });
  document.getElementById("next-btn").addEventListener("click", () => {
    if (session.index < 9) { session.index++; renderQuiz(); }
  });
  document.getElementById("grade-btn").addEventListener("click", () => {
    const unanswered = session.questions.findIndex((q) => q.selected === null);
    if (unanswered !== -1 && !confirm(`未回答の問題（第${unanswered + 1}問目など）があります。このまま採点しますか？`)) {
      return;
    }
    session.submitted = true;
    renderResult();
  });
}

function renderResult() {
  const app = document.getElementById("app-view");
  const correctCount = session.questions.filter((q) => q.selected === q.correctIdx).length;
  const list = session.questions
    .map((item, i) => ({ item, i, ok: item.selected === item.correctIdx }))
    .filter(({ ok }) => !session.onlyWrong || !ok);

  const itemsHtml = list.map(({ item, i, ok }) => {
    const badge = ok
      ? `<span class="badge-ok">正解</span>`
      : `<span class="badge-ng">不正解</span>`;
    const userAns = item.selected !== null ? `${item.selected + 1}. ${item.choices[item.selected]}` : "未回答";
    const rightAns = `${item.correctIdx + 1}. ${item.choices[item.correctIdx]}`;
    return `
      <div class="res-item">
        <div class="q-meta"><span>第 ${i + 1} 問 ${badge}</span></div>
        <div class="q-text">${item.q}</div>
        <div>あなたの回答：${userAns}</div>
        <div>正解：<strong>${rightAns}</strong></div>
        <div class="exp">${item.exp}</div>
      </div>
    `;
  }).join("");

  app.innerHTML = `
    <div class="card">
      <h1>採点結果：${correctCount} / 10 問正解（正答率 ${correctCount * 10}%）</h1>
      <div class="nav-row">
        <div>
          <button type="button" class="secondary" id="filter-btn">${session.onlyWrong ? "全10問を表示" : "不正解のみ表示"}</button>
          <button type="button" class="secondary" id="back-btn">回答を見直す</button>
        </div>
        <button type="button" id="retry-btn">次の10問に挑戦</button>
      </div>
      ${itemsHtml || `<p class="muted" style="margin-top:16px;">不正解の問題はありませんでした。</p>`}
    </div>
  `;

  document.getElementById("filter-btn").addEventListener("click", () => {
    session.onlyWrong = !session.onlyWrong;
    renderResult();
  });
  document.getElementById("back-btn").addEventListener("click", () => {
    session.index = 0;
    renderQuiz();
  });
  document.getElementById("retry-btn").addEventListener("click", () => {
    startNewSet(currentMode);
  });
}

startNewSet("all");
