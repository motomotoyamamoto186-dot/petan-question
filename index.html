function loadUsers() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.users) && parsed.users.length > 0) {
        return parsed;
      }
    }
  } catch (e) {}
  const defaultState = {
    currentUserId: "default",
    users: [
      { id: "default", name: "ゲスト（初期ユーザー）", stats: {} }
    ]
  };
  saveUsers(defaultState);
  return defaultState;
}

function saveUsers(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

let userState = loadUsers();

function getCurrentUser() {
  return userState.users.find((u) => u.id === userState.currentUserId) || userState.users[0];
}

function recordResult(questionId, isCorrect) {
  const user = getCurrentUser();
  if (!user.stats[questionId]) {
    user.stats[questionId] = { attempts: 0, wrong: 0 };
  }
  user.stats[questionId].attempts += 1;
  if (!isCorrect) {
    user.stats[questionId].wrong += 1;
  }
  saveUsers(userState);
}

function getWeakQuestionIds(user) {
  return Object.keys(user.stats).filter((qid) => user.stats[qid].wrong > 0);
}

function analyzeWeakFields(user) {
  const fieldMap = {};
  QUESTIONS.forEach((q) => {
    const st = user.stats[q.id];
    if (st && st.attempts > 0) {
      if (!fieldMap[q.field]) fieldMap[q.field] = { attempts: 0, wrong: 0 };
      fieldMap[q.field].attempts += st.attempts;
      fieldMap[q.field].wrong += st.wrong;
    }
  });
  return Object.entries(fieldMap)
    .map(([field, data]) => ({
      field,
      attempts: data.attempts,
      wrong: data.wrong,
      wrongRate: Math.round((data.wrong / data.attempts) * 100)
    }))
    .filter((item) => item.wrong > 0)
    .sort((a, b) => b.wrongRate - a.wrongRate || b.wrong - a.wrong);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  const header = document.getElementById("user-header");
  const current = getCurrentUser();
  const optionsHtml = userState.users.map((u) =>
    `<option value="${u.id}" ${u.id === current.id ? "selected" : ""}>${u.name}</option>`
  ).join("");

  header.innerHTML = `
    <div class="user-controls">
      <strong>学習ユーザー：</strong>
      <select id="user-select">${optionsHtml}</select>
      <button type="button" class="secondary small" id="add-user-btn">＋ユーザー登録</button>
      ${userState.users.length > 1 ? `<button type="button" class="danger small" id="del-user-btn">削除</button>` : ""}
    </div>
    <div class="user-controls">
      ${session ? `<button type="button" class="secondary small" id="home-btn">トップ（モード選択）へ戻る</button>` : ""}
    </div>
  `;

  document.getElementById("user-select").addEventListener("change", (e) => {
    userState.currentUserId = e.target.value;
    saveUsers(userState);
    if (!session) renderIntro();
    else renderUserHeader();
  });

  document.getElementById("add-user-btn").addEventListener("click", () => {
    const name = prompt("登録するユーザー名を入力してください（例：寺地、審判試験用 など）：");
    if (!name || !name.trim()) return;
    const newId = "u_" + Date.now();
    userState.users.push({ id: newId, name: name.trim(), stats: {} });
    userState.currentUserId = newId;
    saveUsers(userState);
    renderUserHeader();
    if (!session) renderIntro();
  });

  const delBtn = document.getElementById("del-user-btn");
  if (delBtn) {
    delBtn.addEventListener("click", () => {
      if (!confirm(`ユーザー「${current.name}」と学習履歴を削除しますか？`)) return;
      userState.users = userState.users.filter((u) => u.id !== current.id);
      userState.currentUserId = userState.users[0].id;
      saveUsers(userState);
      session = null;
      renderIntro();
    });
  }

  const homeBtn = document.getElementById("home-btn");
  if (homeBtn) {
    homeBtn.addEventListener("click", () => {
      session = null;
      renderIntro();
    });
  }
}

function startNewSet(mode) {
  const user = getCurrentUser();
  let pool = QUESTIONS;
  let modeLabel = "全問題ランダム";

  if (mode === "sim") {
    pool = QUESTIONS.filter((q) => q.cat === "sim");
    modeLabel = "口頭試問・審判シミュレーション";
  } else if (mode === "weak") {
    const weakIds = new Set(getWeakQuestionIds(user));
    pool = QUESTIONS.filter((q) => weakIds.has(q.id));
    modeLabel = "苦手問題集中復習";
    if (pool.length === 0) {
      alert("苦手問題がありません。");
      renderIntro();
      return;
    }
  }

  const count = Math.min(10, pool.length);
  const picked = shuffle(pool).slice(0, count).map((item) => {
    const pairs = item.choices.map((text, idx) => ({ text, isCorrect: idx === item.ans }));
    const shuffledChoices = shuffle(pairs);
    return {
      id: item.id,
      cat: item.cat,
      field: item.field,
      q: item.q,
      choices: shuffledChoices.map((c) => c.text),
      correctIdx: shuffledChoices.findIndex((c) => c.isCorrect),
      exp: item.exp,
      selected: null
    };
  });

  session = {
    mode,
    modeLabel,
    total: count,
    questions: picked,
    index: 0,
    submitted: false,
    onlyWrong: false
  };
  renderUserHeader();
  renderQuiz();
}

function renderQuiz() {
  const app = document.getElementById("app-view");
  const cur = session.questions[session.index];
  const answeredCount = session.questions.filter((q) => q.selected !== null).length;
  const isLast = session.index === session.total - 1;
  const allAnswered = answeredCount === session.total;
  const tagLabel = cur.cat === "sim" ? "口頭試問シミュレーション" : "競技規則・条文知識";

  const choicesHtml = cur.choices.map((c, idx) => {
    const sel = cur.selected === idx ? "selected" : "";
    return `<button type="button" class="choice ${sel}" data-idx="${idx}">${idx + 1}. ${c}</button>`;
  }).join("");

  // 最後の問題に到達しており、かつ全問回答済みの場合のみ採点・解説ボタンを表示
  let submitButtonHtml = "";
  let hintHtml = "";
  if (isLast) {
    if (allAnswered) {
      submitButtonHtml = `<button type="button" id="grade-btn">${session.total}問まとめて採点・解説を見る</button>`;
    } else {
      hintHtml = `<div class="hint-note">※未回答の問題があります。「前の問題」に戻って全${session.total}問すべてに回答すると、ここに「採点・解説」ボタンが表示されます（現在 ${answeredCount}/${session.total} 問回答済み）。</div>`;
    }
  }

  app.innerHTML = `
    <div class="card">
      <div class="q-meta">
        <span>【${session.modeLabel}】第 ${session.index + 1} 問 / 全 ${session.total} 問（回答済み ${answeredCount}/${session.total}）</span>
        <span class="tag-group">
          <span class="tag">${tagLabel}</span>
          <span class="tag tag-field">${cur.field}</span>
        </span>
      </div>
      <div class="q-text">${cur.q}</div>
      <div>${choicesHtml}</div>
      ${hintHtml}
      <div class="nav-row">
        <div>
          <button type="button" class="secondary" id="prev-btn" ${session.index === 0 ? "disabled" : ""}>前の問題</button>
          ${!isLast ? `<button type="button" id="next-btn">次の問題</button>` : ""}
        </div>
        <div>${submitButtonHtml}</div>
      </div>
    </div>
  `;

  app.querySelectorAll(".choice").forEach((btn) => {
    btn.addEventListener("click", () => {
      cur.selected = Number(btn.dataset.idx);
      renderQuiz();
    });
  });

  document.getElementById("prev-btn").addEventListener("click", () => {
    if (session.index > 0) { session.index--; renderQuiz(); }
  });

  const nextBtn = document.getElementById("next-btn");
  if (nextBtn) {
    nextBtn.addEventListener("click", () => {
      if (session.index < session.total - 1) { session.index++; renderQuiz(); }
    });
  }

  const gradeBtn = document.getElementById("grade-btn");
  if (gradeBtn) {
    gradeBtn.addEventListener("click", () => {
      if (!session.submitted) {
        session.questions.forEach((q) => {
          recordResult(q.id, q.selected === q.correctIdx);
        });
        session.submitted = true;
      }
      renderResult();
    });
  }
}

function renderResult() {
  const app = document.getElementById("app-view");
  const user = getCurrentUser();
  const correctCount = session.questions.filter((q) => q.selected === q.correctIdx).length;
  const rate = Math.round((correctCount / session.total) * 100);
  const weakFields = analyzeWeakFields(user);

  const list = session.questions
    .map((item, i) => ({ item, i, ok: item.selected === item.correctIdx }))
    .filter(({ ok }) => !session.onlyWrong || !ok);

  const itemsHtml = list.map(({ item, i, ok }) => {
    const badge = ok
      ? `<span class="badge-ok">正解</span>`
      : `<span class="badge-ng">不正解（苦手登録）</span>`;
    const userAns = `${item.selected + 1}. ${item.choices[item.selected]}`;
    const rightAns = `${item.correctIdx + 1}. ${item.choices[item.correctIdx]}`;
    return `
      <div class="res-item">
        <div class="q-meta">
          <span>第 ${i + 1} 問 ${badge}</span>
          <span class="tag tag-field">${item.field}</span>
        </div>
        <div class="q-text">${item.q}</div>
        <div>あなたの回答：${userAns}</div>
        <div>正解：<strong>${rightAns}</strong></div>
        <div class="exp">${item.exp}</div>
      </div>
    `;
  }).join("");

  const weakSummaryHtml = weakFields.length > 0
    ? `<div class="weak-box">
         <strong>現在の苦手分野傾向（${user.name}）</strong>
         <ul class="weak-list">
           ${weakFields.slice(0, 3).map((f) => `<li>${f.field}（誤答率 ${f.wrongRate}%：${f.wrong}/${f.attempts}）</li>`).join("")}
         </ul>
       </div>`
    : "";

  app.innerHTML = `
    <div class="card">
      <h1>採点結果（${user.name}）：${correctCount} / ${session.total} 問正解（正答率 ${rate}%）</h1>
      ${weakSummaryHtml}
      <div class="nav-row">
        <div>
          <button type="button" class="secondary" id="filter-btn">${session.onlyWrong ? `全${session.total}問を表示` : "不正解のみ表示"}</button>
          <button type="button" class="secondary" id="top-btn">モード選択へ戻る</button>
        </div>
        <button type="button" id="retry-btn">同じモードでもう1セット</button>
      </div>
      ${itemsHtml || `<p class="muted" style="margin-top:16px;">不正解の問題はありませんでした！</p>`}
    </div>
  `;

  document.getElementById("filter-btn").addEventListener("click", () => {
    session.onlyWrong = !session.onlyWrong;
    renderResult();
  });
  document.getElementById("top-btn").addEventListener("click", () => {
    session = null;
    renderIntro();
  });
  document.getElementById("retry-btn").addEventListener("click", () => {
    startNewSet(session.mode);
  });
}

// 初期表示はトップ（モード選択・ユーザー管理）ページ
renderIntro();
</script>
</body>
</html>
"""

with open("index.html", "w", encoding="utf-8") as f:
    f.write(html_content)

print("Generated index.html successfully. Length:", len(html_content))
