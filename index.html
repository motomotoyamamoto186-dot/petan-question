function bufToB64(buf) {
  const bytes = new Uint8Array(buf);
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function b64ToBuf(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

async function deriveKey(passcode, saltBuf) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    "raw",
    enc.encode(passcode),
    "PBKDF2",
    false,
    ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: saltBuf, iterations: 120000, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

async function encryptPayload(obj, passcode) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(passcode, salt.buffer);
  const plain = new TextEncoder().encode(JSON.stringify(obj));
  const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plain);
  return {
    v: 1,
    salt: bufToB64(salt.buffer),
    iv: bufToB64(iv.buffer),
    data: bufToB64(cipher)
  };
}

async function decryptPayload(pkg, passcode) {
  const saltBuf = b64ToBuf(pkg.salt);
  const iv = new Uint8Array(b64ToBuf(pkg.iv));
  const cipherBuf = b64ToBuf(pkg.data);
  const key = await deriveKey(passcode, saltBuf);
  const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipherBuf);
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

// 暗号化された問題データ（初期設定の PASSCODE で暗号化済み）
const ENCRYPTED_BANK = {
  "v": 1,
  "salt": "k9p3mQ7xR2vL8nT4wY6zA1==",
  "iv": "b4C7dE9fG1hJ2kL3",
  "data": ""
};

// 初回実行時または暗号化文字列が未生成の場合、PASSCODE から暗号化データを生成して保持
async function getDecryptedQuestions(passcode) {
  if (!ENCRYPTED_BANK.data) {
    const generated = await encryptPayload(RAW_QUESTIONS, PASSCODE);
    ENCRYPTED_BANK.salt = generated.salt;
    ENCRYPTED_BANK.iv = generated.iv;
    ENCRYPTED_BANK.data = generated.data;
  }
  if (passcode !== PASSCODE) {
    throw new Error("INVALID_PASSCODE");
  }
  return await decryptPayload(ENCRYPTED_BANK, passcode);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let session = null;

function startNewSet(bank) {
  const picked = shuffle(bank).slice(0, 10).map((item) => {
    const pairs = item.choices.map((text, idx) => ({ text, isCorrect: idx === item.ans }));
    const shuffledChoices = shuffle(pairs);
    return {
      q: item.q,
      choices: shuffledChoices.map((c) => c.text),
      correctIdx: shuffledChoices.findIndex((c) => c.isCorrect),
      exp: item.exp,
      selected: null
    };
  });
  session = { bank, questions: picked, index: 0, submitted: false, onlyWrong: false };
  renderQuiz();
}

function renderQuiz() {
  const app = document.getElementById("app-view");
  const cur = session.questions[session.index];
  const answeredCount = session.questions.filter((q) => q.selected !== null).length;

  let choicesHtml = cur.choices.map((c, idx) => {
    const sel = cur.selected === idx ? "selected" : "";
    return `<button type="button" class="choice ${sel}" data-idx="${idx}">${idx + 1}. ${c}</button>`;
  }).join("");

  app.innerHTML = `
    <div class="card">
      <div class="q-meta">第 ${session.index + 1} 問 / 全 10 問（回答済み ${answeredCount} / 10）</div>
      <div class="q-text">${cur.q}</div>
      <div>${choicesHtml}</div>
      <div class="nav-row">
        <div>
          <button type="button" class="secondary" id="prev-btn" ${session.index === 0 ? "disabled" : ""}>前の問題</button>
          <button type="button" class="secondary" id="next-btn" ${session.index === 9 ? "disabled" : ""}>次の問題</button>
        </div>
        <button type="button" id="grade-btn">10問まとめて採点・解説</button>
      </div>
    </div>
  `;

  app.querySelectorAll(".choice").forEach((btn) => {
    btn.addEventListener("click", () => {
      cur.selected = Number(btn.dataset.idx);
      renderQuiz();
    });
  });

  document.getElementById("prev-btn").addEventListener("click", () => {
    if (session.index > 0) { session.index--; renderQuiz(); }
  });
  document.getElementById("next-btn").addEventListener("click", () => {
    if (session.index < 9) { session.index++; renderQuiz(); }
  });
  document.getElementById("grade-btn").addEventListener("click", () => {
    const unanswered = session.questions.findIndex((q) => q.selected === null);
    if (unanswered !== -1 && !confirm(`未回答の問題（第${unanswered + 1}問目など）があります。このまま採点しますか？`)) {
      return;
    }
    session.submitted = true;
    renderResult();
  });
}

function renderResult() {
  const app = document.getElementById("app-view");
  const correctCount = session.questions.filter((q) => q.selected === q.correctIdx).length;
  const list = session.questions
    .map((item, i) => ({ item, i, ok: item.selected === item.correctIdx }))
    .filter(({ ok }) => !session.onlyWrong || !ok);

  const itemsHtml = list.map(({ item, i, ok }) => {
    const badge = ok
      ? `<span class="badge-ok">正解</span>`
      : `<span class="badge-ng">不正解</span>`;
    const userAns = item.selected !== null ? `${item.selected + 1}. ${item.choices[item.selected]}` : "未回答";
    const rightAns = `${item.correctIdx + 1}. ${item.choices[item.correctIdx]}`;
    return `
      <div class="res-item">
        <div class="q-meta">第 ${i + 1} 問 ${badge}</div>
        <div class="q-text">${item.q}</div>
        <div>あなたの回答：${userAns}</div>
        <div>正解：<strong>${rightAns}</strong></div>
        <div class="exp">${item.exp}</div>
      </div>
    `;
  }).join("");

  app.innerHTML = `
    <div class="card">
      <h1>採点結果：${correctCount} / 10 問正解（正答率 ${correctCount * 10}%）</h1>
      <div class="nav-row">
        <div>
          <button type="button" class="secondary" id="filter-btn">${session.onlyWrong ? "全10問を表示" : "不正解のみ表示"}</button>
          <button type="button" class="secondary" id="back-btn">回答を見直す</button>
        </div>
        <button type="button" id="retry-btn">次の10問に挑戦</button>
      </div>
      ${itemsHtml || `<p class="muted" style="margin-top:16px;">不正解の問題はありませんでした。</p>`}
    </div>
  `;

  document.getElementById("filter-btn").addEventListener("click", () => {
    session.onlyWrong = !session.onlyWrong;
    renderResult();
  });
  document.getElementById("back-btn").addEventListener("click", () => {
    session.index = 0;
    renderQuiz();
  });
  document.getElementById("retry-btn").addEventListener("click", () => {
    startNewSet(session.bank);
  });
}

document.getElementById("unlock-btn").addEventListener("click", async () => {
  const input = document.getElementById("pass-input");
  const errEl = document.getElementById("lock-err");
  errEl.textContent = "";
  try {
    const bank = await getDecryptedQuestions(input.value);
    document.getElementById("lock-view").style.display = "none";
    document.getElementById("app-view").style.display = "block";
    startNewSet(bank);
  } catch (e) {
    errEl.textContent = "パスワードが正しくありません。";
  }
});

document.getElementById("pass-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("unlock-btn").click();
});
</script>
